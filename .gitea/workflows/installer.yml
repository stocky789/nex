name: Installer
# SCOPED TO AN UNPRIVILEGED CONTAINER RUNNER — this job does NOT verify the ISO.
#
# The Gitea runner executes jobs inside an unprivileged container, so $PWD is not a
# path on the Docker host (bind mounts into the builder image resolve to an empty
# directory) and CAP_NET_ADMIN is unavailable (ip link cannot create interfaces).
# Four checks were removed for that reason, not because they stopped mattering:
#
#   * management bridge verification with native Debian networking (needs ip link)
#   * DHCP preview verification (bind-mounts the workspace into a container)
#   * ISO build and installer initramfs completeness (bind-mounts the workspace)
#   * native wizard review, disk confirmation and installer progress (needs the ISO)
#
# Nothing here establishes that a bootable, correct ISO can be produced. Restore the
# removed steps by giving act_runner a host label ("ubuntu-latest:host" in its
# config.yaml) and reverting this file. See docs/BUG_LEDGER.md BUG-0043.
#
# KEEP THIS FILE AND .github/workflows/installer.yml IDENTICAL. Gitea on
# git.stockhome.com.au executes the workflows in .github/workflows, not this
# directory, so editing only this copy changes nothing.
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  installer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Printed on every run so a green result is never mistaken for ISO coverage.
      - name: State what this job does not cover
        run: |
          echo '::warning::Installer job is scoped to source-level checks on this runner. The ISO is NOT built, and the management bridge, DHCP preview, initramfs completeness and wizard/progress checks DID NOT RUN. A pass here does not mean the ISO is buildable or correct. See docs/BUG_LEDGER.md BUG-0043.'

      # The checks below used to run inside the builder image purely to get a toolchain.
      # They read and compile source and need no privileges, so run them directly.
      - name: Install source-check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gcc pkg-config libglib2.0-dev python3

      - name: Check installer source contract
        run: bash installer/check.sh

      - name: Run installer regressions
        run: |
          set -eu
          python3 tests/integration/installer-shell.py
          cc -Wall -Wextra -Werror tests/integration/installer-network.c installer/gui/nex-network.c $(pkg-config --cflags --libs glib-2.0) -o /tmp/nex-network-test
          /tmp/nex-network-test
          python3 tests/integration/installer-handoff.py
          python3 tests/integration/installer-keyboard.py
          python3 tests/integration/installer-qol.py
          python3 tests/integration/installer-hostname.py
          python3 tests/integration/installer-link.py
          python3 tests/integration/installer-disk.py

      # Building the image needs no bind mount, so this still catches a broken
      # Dockerfile or a build dependency that vanished from Debian trixie. It does
      # not exercise the image; nothing is run inside it.
      - name: Verify the installer toolchain image still builds
        run: |
          docker info
          docker build -t nex-iso-builder -f installer/Dockerfile installer
