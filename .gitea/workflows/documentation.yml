name: Documentation
on:
  push:
  pull_request:
permissions:
  code: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ gitea.event.pull_request.head.sha || github.sha }}
      - name: Test documentation gate
        run: python3 -m unittest discover -s tests -p 'test_check_docs.py' -v
      - name: Check documentation impact and guide
        env:
          DOCS_EVENT: ${{ gitea.event_name }}
          DOCS_BEFORE: ${{ gitea.event.before }}
          DOCS_AFTER: ${{ gitea.event.after }}
          DOCS_REF: ${{ gitea.ref }}
          DOCS_DEFAULT_BRANCH: ${{ gitea.event.repository.default_branch }}
          DOCS_PR_BASE: ${{ gitea.event.pull_request.base.sha }}
          DOCS_PR_HEAD: ${{ gitea.event.pull_request.head.sha }}
        run: |
          case "$DOCS_EVENT" in
            pull_request)
              python3 scripts/check_docs.py --base "$DOCS_PR_BASE" --head "$DOCS_PR_HEAD" --merge-base
              ;;
            push)
              if [ "$DOCS_BEFORE" = "0000000000000000000000000000000000000000" ] && [ "$DOCS_REF" != "refs/heads/$DOCS_DEFAULT_BRANCH" ]; then
                test -n "$DOCS_DEFAULT_BRANCH"
                DOCS_BRANCH_BASE=$(git rev-parse --verify "refs/remotes/origin/${DOCS_DEFAULT_BRANCH}^{commit}")
                python3 scripts/check_docs.py --base "$DOCS_BRANCH_BASE" --head "$DOCS_AFTER" --merge-base
              else
                python3 scripts/check_docs.py --base "$DOCS_BEFORE" --head "$DOCS_AFTER"
              fi
              ;;
            *) echo "Unsupported documentation event" >&2; exit 1 ;;
          esac
