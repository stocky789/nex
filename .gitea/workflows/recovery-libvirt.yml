name: Recovery libvirt regressions
on:
  push:
    branches:
      - '**'
  pull_request:
concurrency:
  # Same shared act_runner as Controller foundation and Release. A separate
  # recovery-libvirt-* group can run beside those jobs and starve the host.
  group: nex-shared-runner
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  recovery-libvirt:
    if: github.server_url != 'https://github.com' # heavy disposable build is forge-only
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # Default host_run builds the candidate then runs helper, TCG lifecycle, and
      # AppArmor system-guest probes with system_mode=all (midcommit + branch + deep32).
      # Leftover (not wired here — long disposable Core labs, not safe/cheap for forge):
      # recovery_s0_interrupt.py, recovery_s0_backup.py, recovery_s0_firmware.py,
      # core_local_snapshot_api.py, core_snapshot_controller_replacement.py.
      - name: Build candidate and run helper, TCG lifecycle, and AppArmor guest regressions (system_mode=all)
        run: |
          docker info >/dev/null
          python3 tests/integration/libvirt_recovery_ci.py
