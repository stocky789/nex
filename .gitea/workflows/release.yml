name: Release
# Push-driven release for two channels. Every push to main (stable) or dev (development)
# rebuilds both ISOs, publishes them to that channel's download tree, then creates the Gitea
# release for the tag. Stable builds the newest
# CHANGELOG version, tag vX.Y.Z[-preN], replacing that version's previous release and
# moving its tag when the version was already published. Development builds a pre-release
# of the next release, tag vX.Y.Z-dev.N (scripts/release-version.py --channel dev), marked
# as a Gitea pre-release with only the newest builds kept.
# Forge release assets are the two ISOs and their checksums.
# Source, compliance manifests and hash-pinned Nex netinst payloads live in the
# website download tree.
# The CHANGELOG heading and the Debian package version are one number in two
# notations, so a release can never ship stamped with a version its changelog does
# not describe.
#
# The development channel is a subtree of the stable download root on the website host:
# /downloads/dev (/srv/nex-downloads/dev). Only a stable run deploys the static website pages.
#
# The ISO build runs builder containers on the runner's Docker host. On a runner that
# executes jobs inside a container, the workspace is a Docker volume; the job finds
# that volume's host path and scripts/ci-docker.sh rewrites every bind mount to it.
#
# Secrets:
#   NEX_DEPLOY_HOST             website publishing: host address, publishing user, that
#   NEX_DEPLOY_USER             user's SSH key, and the host's public key. Set all four
#   NEX_DEPLOY_KEY              together; all four are required for a release.
#   NEX_DEPLOY_KNOWN_HOSTS      The same run publishes ISO/source downloads and the static
#                               website pages.
on:
  push:
    branches:
      - main
      - dev
defaults:
  run:
    # Host-side flock preserves every queued run, including on forges without queue:max.
    shell: bash -c 'exec bash "$GITHUB_WORKSPACE/scripts/ci-heavy-step.sh" "$1"' -- {0}
permissions:
  contents: write
env:
  NEX_CI_LOCK: shared
  # Docker-host directory for the retained Debian source archives (Actions variable; unset = the build-cache volume).
  NEX_SOURCE_CACHE: ${{ vars.NEX_SOURCE_CACHE }}
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      # The corresponding-source archive vendors the Go modules and records the
      # toolchain, so the job needs the pinned Go the appliance builds with.
      - uses: https://github.com/actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'

      - name: Resolve release channel, version and notes
        id: version
        env:
          NEX_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p .cache
          # main publishes the stable channel from its newest CHANGELOG heading. dev publishes the
          # development channel: a numbered pre-release of the release main publishes next.
          args=()
          case "$NEX_BRANCH" in
            main) channel=stable downloads=downloads ;;
            dev)
              channel=dev downloads=downloads/dev
              git show origin/main:CHANGELOG.md > .cache/stable-changelog.md
              args=(--channel dev --build "$(git rev-list --count HEAD)" --stable-changelog .cache/stable-changelog.md) ;;
            *) echo "Release runs for main and dev only, not $NEX_BRANCH" >&2; exit 1 ;;
          esac
          read -r tag_version version < <(python3 scripts/release-version.py --current "${args[@]}" --format both)
          python3 scripts/release-version.py --current "${args[@]}" --notes > .cache/release-notes.md
          {
            echo "tag=v$tag_version"
            echo "version=$version"
            echo "public_version=$tag_version"
            echo "channel=$channel"
            echo "downloads_path=$downloads"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing v$tag_version on the $channel channel as Debian version $version"

      - name: Locate the workspace on the Docker host
        id: host
        run: |
          set -euo pipefail
          docker info > /dev/null
          probe() {
            docker run --rm -v "$1:/probe:ro" --entrypoint sh debian:trixie-slim \
              -c 'test -f /probe/installer/build.sh' 2> /dev/null
          }
          host=$PWD
          if ! probe "$host"; then
            # Jobs run inside a container: the workspace is a named volume. Read which
            # one from our own mount table and ask the daemon where it lives on the host.
            root=$(awk -v w="$PWD" '$5 == w { print $4 }' /proc/self/mountinfo)
            name=$(printf '%s\n' "$root" | sed -n 's#.*/volumes/\([^/]*\)/_data.*#\1#p')
            [ -n "$name" ] || {
              echo "workspace $PWD is neither a Docker host path nor a Docker volume (mount root: '$root')" >&2
              exit 1
            }
            host=$(docker volume inspect -f '{{.Mountpoint}}' "$name")
            probe "$host" || {
              echo "Docker host path $host for volume $name does not contain this workspace" >&2
              exit 1
            }
          fi
          echo "workspace=$host" >> "$GITHUB_OUTPUT"
          echo "The Docker host sees the workspace at $host"

      # libvirt and dlm are rebuilt from pinned Debian sources by a recipe that rarely changes.
      # scripts/build-release-packages.sh records a digest of each build's inputs beside its output and
      # reuses the output when the digest still matches, so a restored entry skips about eight minutes.
      # The key names the same inputs; the script's digest is what makes a stale entry harmless.
      - name: Restore the matched libvirt and dlm builds
        uses: https://github.com/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .cache/release-packages/libvirt
            .cache/release-packages/libvirt.inputs
            .cache/release-packages/dlm
            .cache/release-packages/dlm.inputs
          key: matched-builds-${{ hashFiles('packaging/libvirt/**', 'packaging/cluster-storage/**', 'tests/integration/libvirt_readonly_policy.py', 'scripts/build-release-packages.sh') }}

      - name: Build the image, the packages and both ISOs
        env:
          NEX_VERSION: ${{ steps.version.outputs.version }}
          NEX_PUBLIC_VERSION: ${{ steps.version.outputs.public_version }}
          NEX_DOWNLOADS_PATH: ${{ steps.version.outputs.downloads_path }}
          NEX_HOST_WORKSPACE: ${{ steps.host.outputs.workspace }}
          NEX_PUBLIC_URL: ${{ secrets.NEX_PUBLIC_URL || 'https://nexvirtualization.com' }}
          NEX_UPDATE_TRUST_B64: ${{ secrets.NEX_UPDATE_TRUST_B64 }}
        run: |
          set -euo pipefail
          export NEX_DOCKER=$PWD/scripts/ci-docker.sh
          # The signed trust.json is pinned into the image: without it the host could not verify any update.
          [ -n "${NEX_UPDATE_TRUST_B64:-}" ] || { echo 'NEX_UPDATE_TRUST_B64 is required: the image must carry its update trust' >&2; exit 1; }
          mkdir -p .cache
          printf '%s' "$NEX_UPDATE_TRUST_B64" | base64 -d > .cache/update-trust.json
          export NEX_UPDATE_TRUST=$PWD/.cache/update-trust.json
          # Builder containers can only mount paths under the workspace, so the
          # temporary build inputs must live there too.
          export TMPDIR=$PWD/.cache/tmp
          mkdir -p "$TMPDIR"
          sequence=$(git rev-list --count HEAD)
          packages=$PWD/.cache/release-packages
          out=$PWD/.cache/image-release
          # installer/build.sh builds the Controller guest image and the corresponding source itself;
          # the Core image is built first and handed to it.
          python3 scripts/build-source.py
          python3 packaging/core-local/build.py \
            --source dist/nex-source.tar.gz --version "$NEX_VERSION" \
            --output "$packages/core-local" --docker "$NEX_DOCKER"
          bash scripts/build-release-packages.sh "${packages#"$PWD"/}"
          NEX_LABEL="$NEX_PUBLIC_VERSION" NEX_SEQUENCE="$sequence" NEX_IMAGE_OUT="$out" \
            NEX_PACKAGE_DIRS="$packages/core-local:$packages/dlm:$packages/libvirt" sh image/build.sh all
          export NEX_NETINST_BASE_URL="${NEX_PUBLIC_URL%/}/${NEX_DOWNLOADS_PATH}/${NEX_PUBLIC_VERSION}"
          export NEX_IMAGE_DIR=.cache/image-release/release NEX_HOSTIMAGE_BIN=.cache/image-release/nex-hostimage
          bash installer/build.sh

      - name: Verify every artifact carries the released version
        env:
          NEX_VERSION: ${{ steps.version.outputs.version }}
          NEX_PUBLIC_VERSION: ${{ steps.version.outputs.public_version }}
        run: |
          set -euo pipefail
          iso="dist/nex-core-${NEX_PUBLIC_VERSION}-amd64.iso"
          source="dist/nex-core-${NEX_PUBLIC_VERSION}-source.tar.gz"
          manifest="dist/nex-core-${NEX_PUBLIC_VERSION}-compliance-manifest.json"
          core=".cache/release-packages/core-local/nex-core-local_${NEX_VERSION}_amd64.deb"
          netinst="dist/nex-core-${NEX_PUBLIC_VERSION}-amd64-netinst.iso"
          netinst_manifest="dist/nex-core-${NEX_PUBLIC_VERSION}-netinst-compliance-manifest.json"
          for artifact in "$iso" "$source" "$manifest" "$core" "$netinst" "$netinst_manifest" dist/netinst/*; do
            [ -f "$artifact" ] || { echo "missing artifact: $artifact" >&2; exit 1; }
            stat --printf='%n: %s bytes\n' "$artifact"
          done
          # A matching filename is not proof of a matching package version.
          actual=$(dpkg-deb -f "$core" Version)
          [ "$actual" = "$NEX_VERSION" ] || {
            echo "$core declares $actual, expected $NEX_VERSION" >&2; exit 1; }
          # Every netinst payload is served as <sha256>-<file name>, bound to its own bytes.
          for payload in dist/netinst/*; do
            payload_hash=$(sha256sum "$payload" | cut -d' ' -f1)
            case "${payload##*/}" in
              "$payload_hash"-*) ;;
              *) echo "netinst payload filename is not bound to its hash: $payload" >&2; exit 1 ;;
            esac
          done
          ( cd dist && for artifact in \
              "nex-core-${NEX_PUBLIC_VERSION}-amd64.iso" \
              "nex-core-${NEX_PUBLIC_VERSION}-source.tar.gz" \
              "nex-core-${NEX_PUBLIC_VERSION}-compliance-manifest.json" \
              "nex-core-${NEX_PUBLIC_VERSION}-amd64-netinst.iso" \
              "nex-core-${NEX_PUBLIC_VERSION}-netinst-compliance-manifest.json"; do
              sha256sum "$artifact" > "$artifact.sha256"
            done )
          # Validate every ISO/source/payload binding before any public upload.
          validation=$(mktemp -d)
          trap 'rm -rf "$validation"' EXIT
          payload_args=()
          for payload in dist/netinst/*; do
            payload_args+=(--netinst-payload "$payload")
          done
          python3 scripts/release-publish.py --check --root "$validation" \
            --iso "$iso" --source "$source" --compliance-manifest "$manifest" \
            --netinst-iso "$netinst" --netinst-manifest "$netinst_manifest" "${payload_args[@]}"

      # The ISO has to start: the BIOS and the UEFI boot menus must come up under QEMU. Emulated, because the runner is a
      # nested guest. A full install is not run here.
      - name: Boot both ISOs under QEMU
        env:
          NEX_PUBLIC_VERSION: ${{ steps.version.outputs.public_version }}
        run: |
          set -euo pipefail
          if ! command -v qemu-system-x86_64 > /dev/null || [ ! -e /usr/share/OVMF/OVMF_CODE_4M.fd ]; then
            sudo=''
            [ "$(id -u)" = 0 ] || sudo=sudo
            $sudo apt-get update -qq
            $sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf
          fi
          # Each guest only waits out a fixed boot window, so the two ISOs run side by side.
          pids=()
          for name in "nex-core-${NEX_PUBLIC_VERSION}-amd64.iso" "nex-core-${NEX_PUBLIC_VERSION}-amd64-netinst.iso"; do
            python3 tests/integration/iso-smoke.py "dist/$name" --accel tcg --output ".cache/iso-smoke/${name%.iso}" &
            pids+=($!)
          done
          status=0
          for pid in "${pids[@]}"; do
            wait "$pid" || status=$?
          done
          exit "$status"

      - name: Check for deploy credentials
        id: deploy
        env:
          NEX_DEPLOY_HOST: ${{ secrets.NEX_DEPLOY_HOST }}
          NEX_DEPLOY_KEY: ${{ secrets.NEX_DEPLOY_KEY }}
          NEX_DEPLOY_USER: ${{ secrets.NEX_DEPLOY_USER }}
          NEX_DEPLOY_KNOWN_HOSTS: ${{ secrets.NEX_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -eu
          # Netinst payloads live on the download site, so every release needs it.
          missing=""
          for pair in "NEX_DEPLOY_HOST=${NEX_DEPLOY_HOST:-}" \
                      "NEX_DEPLOY_USER=${NEX_DEPLOY_USER:-}" \
                      "NEX_DEPLOY_KEY=${NEX_DEPLOY_KEY:-}" \
                      "NEX_DEPLOY_KNOWN_HOSTS=${NEX_DEPLOY_KNOWN_HOSTS:-}"; do
            if [ -z "${pair#*=}" ]; then
              missing="$missing ${pair%%=*}"
            fi
          done
          missing=${missing# }
          if [ -n "$missing" ]; then
            echo "Release requires website deployment; missing: $missing" >&2
            exit 1
          fi
          echo 'enabled=true' >> "$GITHUB_OUTPUT"
      - name: Set up Node.js for the website
        if: steps.deploy.outputs.enabled == 'true'
        uses: https://github.com/actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Build the static website
        if: steps.deploy.outputs.enabled == 'true'
        run: |
          npm --prefix website ci
          npm --prefix website run check
          npm --prefix website run build

      - name: Publish to the website host
        if: steps.deploy.outputs.enabled == 'true'
        env:
          NEX_VERSION: ${{ steps.version.outputs.version }}
          NEX_PUBLIC_VERSION: ${{ steps.version.outputs.public_version }}
          NEX_CHANNEL: ${{ steps.version.outputs.channel }}
          NEX_DEPLOY_HOST: ${{ secrets.NEX_DEPLOY_HOST }}
          NEX_DEPLOY_KEY: ${{ secrets.NEX_DEPLOY_KEY }}
          NEX_DEPLOY_KNOWN_HOSTS: ${{ secrets.NEX_DEPLOY_KNOWN_HOSTS }}
          NEX_DEPLOY_USER: ${{ secrets.NEX_DEPLOY_USER }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${NEX_DEPLOY_KNOWN_HOSTS:-}" ]; then
            echo 'NEX_DEPLOY_KNOWN_HOSTS is required; refusing to trust an unverified host' >&2
            exit 1
          fi
          # umask before writing the key: a world-readable key is refused by ssh anyway,
          # and the runner's workspace may be shared between jobs.
          umask 077
          keydir=$(mktemp -d)
          trap 'rm -rf "$keydir"' EXIT
          printf '%s\n' "$NEX_DEPLOY_KEY" > "$keydir/id"
          printf '%s\n' "$NEX_DEPLOY_KNOWN_HOSTS" > "$keydir/known_hosts"
          ssh_opts="-i $keydir/id -o IdentitiesOnly=yes -o UserKnownHostsFile=$keydir/known_hosts -o StrictHostKeyChecking=yes"
          target="$NEX_DEPLOY_USER@$NEX_DEPLOY_HOST"
          staging="/tmp/nex-release-$NEX_VERSION"

          # shellcheck disable=SC2086
          ssh $ssh_opts "$target" "rm -rf '$staging' && mkdir -m 700 '$staging'"
          # shellcheck disable=SC2086
          scp $ssh_opts \
            "dist/nex-core-${NEX_PUBLIC_VERSION}-amd64.iso" \
            "dist/nex-core-${NEX_PUBLIC_VERSION}-source.tar.gz" \
            "dist/nex-core-${NEX_PUBLIC_VERSION}-compliance-manifest.json" \
            "dist/nex-core-${NEX_PUBLIC_VERSION}-amd64-netinst.iso" \
            "dist/nex-core-${NEX_PUBLIC_VERSION}-netinst-compliance-manifest.json" \
            dist/netinst/* \
            scripts/release-publish.py \
            "$target:$staging/"

          # Expand every staged netinst payload into its own --netinst-payload, matching the
          # local validation loop. Unquoted globs would pass one literal pattern.
          payload_args=()
          for payload in dist/netinst/*; do
            payload_args+=(--netinst-payload "'$staging/${payload##*/}'")
          done
          # The development channel is its own download root beneath the stable one, so it has
          # its own `latest` link and retention.
          root_args=""
          if [ "$NEX_CHANNEL" = dev ]; then
            root_args="--root /srv/nex-downloads/dev"
          fi
          # shellcheck disable=SC2086
          ssh $ssh_opts "$target" "set -eu
            python3 '$staging/release-publish.py' $root_args --iso '$staging/nex-core-${NEX_PUBLIC_VERSION}-amd64.iso' --source '$staging/nex-core-${NEX_PUBLIC_VERSION}-source.tar.gz' --compliance-manifest '$staging/nex-core-${NEX_PUBLIC_VERSION}-compliance-manifest.json' --netinst-iso '$staging/nex-core-${NEX_PUBLIC_VERSION}-amd64-netinst.iso' --netinst-manifest '$staging/nex-core-${NEX_PUBLIC_VERSION}-netinst-compliance-manifest.json' ${payload_args[*]} --keep 3
            rm -rf '$staging'"

          # Static pages last: same host, same secrets, one Release run. Only the stable
          # channel publishes them; a development run must never replace the live site.
          if [ "$NEX_CHANNEL" = stable ]; then
            scripts/website-ci-deploy.sh
          fi

      # The signed update tree hosts fetch from <site>/updates/<channel>/channel.json. The release key signs on the
      # website host for the length of the command and never stays on disk; the trust document is already there.
      - name: Publish the signed update tree
        if: steps.deploy.outputs.enabled == 'true'
        env:
          NEX_CHANNEL: ${{ steps.version.outputs.channel }}
          NEX_VERSION: ${{ steps.version.outputs.version }}
          NEX_PUBLIC_VERSION: ${{ steps.version.outputs.public_version }}
          NEX_UPDATE_RELEASE_KEY_B64: ${{ secrets.NEX_UPDATE_RELEASE_KEY_B64 }}
          NEX_DEPLOY_HOST: ${{ secrets.NEX_DEPLOY_HOST }}
          NEX_DEPLOY_KEY: ${{ secrets.NEX_DEPLOY_KEY }}
          NEX_DEPLOY_KNOWN_HOSTS: ${{ secrets.NEX_DEPLOY_KNOWN_HOSTS }}
          NEX_DEPLOY_USER: ${{ secrets.NEX_DEPLOY_USER }}
        run: |
          set -euo pipefail
          # Base64, one line: the forge masks a single-line secret in the log, not a multi-line key.
          [ -n "${NEX_UPDATE_RELEASE_KEY_B64:-}" ] || { echo 'NEX_UPDATE_RELEASE_KEY_B64 is required to publish updates' >&2; exit 1; }
          umask 077
          keydir=$(mktemp -d)
          trap 'rm -rf "$keydir"' EXIT
          printf '%s\n' "$NEX_DEPLOY_KEY" > "$keydir/id"
          printf '%s\n' "$NEX_DEPLOY_KNOWN_HOSTS" > "$keydir/known_hosts"
          ssh_opts="-i $keydir/id -o IdentitiesOnly=yes -o UserKnownHostsFile=$keydir/known_hosts -o StrictHostKeyChecking=yes"
          target="$NEX_DEPLOY_USER@$NEX_DEPLOY_HOST"
          staging="/tmp/nex-update-$NEX_VERSION"
          # shellcheck disable=SC2086
          ssh $ssh_opts "$target" "rm -rf '$staging' && mkdir -m 700 '$staging'"
          # shellcheck disable=SC2086
          scp -r $ssh_opts .cache/image-release/release "$target:$staging/release"
          # shellcheck disable=SC2086
          scp $ssh_opts \
            "dist/nex-core-${NEX_PUBLIC_VERSION}-source.tar.gz" \
            "dist/nex-core-${NEX_PUBLIC_VERSION}-compliance-manifest.json" \
            scripts/update-publish.py \
            "$target:$staging/"
          # shellcheck disable=SC2086
          printf '%s' "$NEX_UPDATE_RELEASE_KEY_B64" | base64 -d | ssh $ssh_opts "$target" "set -eu
            trap 'rm -rf $staging' EXIT
            (umask 077; cat > '$staging/release.key')
            umask 022
            cd '$staging'
            python3 update-publish.py publish --base /srv/nex-updates --release-dir release --release-key release.key --channel '$NEX_CHANNEL' --source 'nex-core-${NEX_PUBLIC_VERSION}-source.tar.gz' --compliance 'nex-core-${NEX_PUBLIC_VERSION}-compliance-manifest.json'
            python3 update-publish.py prune --base /srv/nex-updates --keep 5"

      - name: Confirm the release is actually reachable
        if: steps.deploy.outputs.enabled == 'true'
        env:
          NEX_PUBLIC_VERSION: ${{ steps.version.outputs.public_version }}
          NEX_DOWNLOADS_PATH: ${{ steps.version.outputs.downloads_path }}
          NEX_CHANNEL: ${{ steps.version.outputs.channel }}
          NEX_PUBLIC_URL: ${{ secrets.NEX_PUBLIC_URL || 'https://nexvirtualization.com' }}
        run: |
          set -euo pipefail
          # Check reachability without downloading multi-gigabyte payloads.
          # The site answers 503 for a moment while the publish it just did settles (run 4319),
          # and curl treats 5xx as retryable only with --retry.
          payload_paths=()
          for payload in dist/netinst/*; do
            [ -f "$payload" ] || { echo 'missing netinst payloads' >&2; exit 1; }
            payload_paths+=("/${NEX_DOWNLOADS_PATH}/${NEX_PUBLIC_VERSION}/${payload##*/}")
          done
          for path in \
            "/" \
            "/updates/trust.json" \
            "/updates/${NEX_CHANNEL}/channel.json" \
            "/${NEX_DOWNLOADS_PATH}/latest.json" \
            "/${NEX_DOWNLOADS_PATH}/${NEX_PUBLIC_VERSION}/nex-core-${NEX_PUBLIC_VERSION}-amd64.iso.sha256" \
            "/${NEX_DOWNLOADS_PATH}/${NEX_PUBLIC_VERSION}/nex-core-${NEX_PUBLIC_VERSION}-source.tar.gz" \
            "/${NEX_DOWNLOADS_PATH}/${NEX_PUBLIC_VERSION}/nex-core-${NEX_PUBLIC_VERSION}-compliance-manifest.json" \
            "/${NEX_DOWNLOADS_PATH}/${NEX_PUBLIC_VERSION}/nex-core-${NEX_PUBLIC_VERSION}-amd64-netinst.iso" \
            "/${NEX_DOWNLOADS_PATH}/${NEX_PUBLIC_VERSION}/nex-core-${NEX_PUBLIC_VERSION}-netinst-compliance-manifest.json" \
            "${payload_paths[@]}"; do
            code=$(curl -sSI -o /dev/null -w '%{http_code}' --max-time 60 --retry 10 --retry-delay 3 "${NEX_PUBLIC_URL}${path}")
            [ "$code" = 200 ] || { echo "$path returned $code" >&2; exit 1; }
          done

      - name: Create or replace the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEX_TAG: ${{ steps.version.outputs.tag }}
          NEX_CHANNEL: ${{ steps.version.outputs.channel }}
        run: |
          set -euo pipefail
          public_version=${NEX_TAG#v}
          args=(--name "Nex Core $public_version")
          if [ "$NEX_CHANNEL" = dev ]; then
            # The tag carries -dev.N, so the forge lists it as a pre-release. Only the newest
            # development release stays, so the release page shows one per channel.
            # The = form is required: argparse reads a separate value that starts with - as an option.
            args=(--name "Nex Core $public_version (development)" '--prune-tags=-dev\.[0-9]+$' --keep 1)
          fi
          assets=()
          for suffix in amd64.iso amd64-netinst.iso; do
            asset="dist/nex-core-${public_version}-${suffix}"
            assets+=("$asset" "$asset.sha256")
          done
          if [ "$NEX_CHANNEL" != dev ]; then
            # Stable: keep only the newest main release (tags without -dev).
            args+=('--prune-tags=^v[0-9]+\.[0-9]+\.[0-9]+$' --keep 1)
          fi
          python3 scripts/gitea-release.py \
            --tag "$NEX_TAG" --target "$GITHUB_SHA" \
            "${args[@]}" --notes .cache/release-notes.md "${assets[@]}"
