name: Image build and boot
# The Nex Core image and the Controller guest image (docs/plans/2026-10-01-immutable-nex-core.md, D4).
# Each job builds an image and boots it once under QEMU. Forge-only: it needs Docker and takes tens of minutes, and none of
# it runs on github.com.
on:
  push:
    branches:
      - main
      - dev
  pull_request:
    paths:
      - 'image/**'
      - 'appliance/**'
      - 'internal/hostimage/**'
      - 'internal/vmhost/**'
      - 'internal/nexupdate/**'
      - 'scripts/update-*.py'
      - 'scripts/image-*'
      - 'tests/integration/image_*.py'
      - 'tests/integration/controller_image_boot.py'
      - '.gitea/workflows/image.yml'
      - '.github/workflows/image.yml'
defaults:
  run:
    # Host-side flock preserves every queued run, including on forges without queue:max.
    shell: bash -c 'exec bash "$GITHUB_WORKSPACE/scripts/ci-heavy-step.sh" "$1"' -- {0}
permissions:
  contents: read
env:
  NEX_CI_LOCK: shared
  # The runner is a nested guest whose hypervisor hard-resets it while KVM guests run, so the QEMU labs emulate
  # (NEX_QEMU_ACCEL=tcg) and every wait they make on a guest is stretched by NEX_QEMU_SLOWDOWN.
  NEX_QEMU_ACCEL: tcg
  NEX_QEMU_SLOWDOWN: "8"
jobs:
  image-build-boot:
    if: github.server_url != 'https://github.com' # forge-only
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container:
      image: docker.gitea.com/runner-images:ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: https://github.com/actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
      # The boot labs run QEMU on the runner itself: name every missing prerequisite here instead of deep in a lab.
      - name: QEMU lab prerequisites (qemu, OVMF, mtools, dosfstools, openssl, sfdisk)
        run: |
          set -euo pipefail
          missing() {
            local tool
            for tool in qemu-system-x86_64 qemu-img mkfs.vfat mcopy openssl sfdisk; do
              command -v "$tool" > /dev/null || echo "$tool"
            done
            [ -e /usr/share/OVMF/OVMF_CODE_4M.fd ] || [ -e /usr/share/edk2/OVMF_CODE_4M.fd ] || echo OVMF
          }
          if [ -n "$(missing)" ]; then
            echo "installing for: $(missing | tr '\n' ' ')"
            sudo=''
            [ "$(id -u)" = 0 ] || sudo=sudo
            $sudo apt-get update -qq
            $sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf mtools dosfstools openssl fdisk
          fi
          left=$(missing | tr '\n' ' ')
          [ -z "$left" ] || { echo "still missing: $left" >&2; exit 1; }
      # The labs and builds bind-mount workspace paths into containers: on a runner whose job runs in a container the
      # workspace is a Docker volume, so name where the Docker host sees it (as release.yml does).
      - name: Locate the workspace on the Docker host
        id: host
        run: |
          ws=$(scripts/ci-host-workspace.sh)
          echo "workspace=$ws" >> "$GITHUB_OUTPUT"
      - name: Build the Nex Core image (base and release set)
        env:
          NEX_HOST_WORKSPACE: ${{ steps.host.outputs.workspace }}
        run: |
          export NEX_DOCKER=$PWD/scripts/ci-docker.sh
          NEX_LABEL=ci NEX_SEQUENCE=1 NEX_IMAGE_OUT="$PWD/.cache/image-ci" image/build.sh all
      # Offline UEFI install of the release with nex-hostimage onto a disk, boot under QEMU/OVMF: read-only erofs root on
      # dm-verity, persistent /etc overlay and /var, persistence across a reboot.
      - name: Boot the installed image under QEMU
        env:
          NEX_HOST_WORKSPACE: ${{ steps.host.outputs.workspace }}
        run: python3 tests/integration/image_boot.py --layout single --release .cache/image-ci/release
  controller-image:
    if: github.server_url != 'https://github.com' # forge-only
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container:
      image: docker.gitea.com/runner-images:ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: https://github.com/actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
      # The boot labs run QEMU on the runner itself: name every missing prerequisite here instead of deep in a lab.
      - name: QEMU lab prerequisites (qemu, OVMF, mtools, dosfstools, openssl, sfdisk)
        run: |
          set -euo pipefail
          missing() {
            local tool
            for tool in qemu-system-x86_64 qemu-img mkfs.vfat mcopy openssl sfdisk; do
              command -v "$tool" > /dev/null || echo "$tool"
            done
            [ -e /usr/share/OVMF/OVMF_CODE_4M.fd ] || [ -e /usr/share/edk2/OVMF_CODE_4M.fd ] || echo OVMF
          }
          if [ -n "$(missing)" ]; then
            echo "installing for: $(missing | tr '\n' ' ')"
            sudo=''
            [ "$(id -u)" = 0 ] || sudo=sudo
            $sudo apt-get update -qq
            $sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf mtools dosfstools openssl fdisk
          fi
          left=$(missing | tr '\n' ' ')
          [ -z "$left" ] || { echo "still missing: $left" >&2; exit 1; }
      # The labs and builds bind-mount workspace paths into containers: on a runner whose job runs in a container the
      # workspace is a Docker volume, so name where the Docker host sees it (as release.yml does).
      - name: Locate the workspace on the Docker host
        id: host
        run: |
          ws=$(scripts/ci-host-workspace.sh)
          echo "workspace=$ws" >> "$GITHUB_OUTPUT"
      # The vm-image component of a release: read-only erofs+verity system disk of Core's two-disk Controller profile.
      - name: Build the Controller guest image
        env:
          NEX_HOST_WORKSPACE: ${{ steps.host.outputs.workspace }}
        run: |
          set -euo pipefail
          export NEX_DOCKER=$PWD/scripts/ci-docker.sh
          # Builder containers can only mount paths under the workspace, so the build inputs must live there too.
          export TMPDIR=$PWD/.cache/tmp
          mkdir -p "$TMPDIR"
          python3 appliance/build.py --version 0.1.0-ci --sequence 1 --output .cache/controller-image \
            --docker "$NEX_DOCKER"
      # UEFI boot as vmhost defines the VM (system disk read-only, blank data disk, NoCloud seed): ready marker over the
      # deployment's own certificate, read-only root, overlay /etc, /var on the data disk, and a reboot on the same data disk.
      - name: Controller guest boot under QEMU
        env:
          NEX_HOST_WORKSPACE: ${{ steps.host.outputs.workspace }}
        run: python3 tests/integration/controller_image_boot.py --release .cache/controller-image --skip-tamper
