# This host's own management controller, over the kernel's local IPMI interface. Nex Core
# reads the controller's LAN address through /dev/ipmi0 and creates its own fence account
# there; without these modules there is no /dev/ipmi0 and the host reports that it has no
# local IPMI interface. A machine with no controller simply loads nothing.
ipmi_si
ipmi_devintf
