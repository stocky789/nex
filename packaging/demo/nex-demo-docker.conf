# Ensure the Unix socket bind directory exists before Docker restarts containers.
[Unit]
# Wants, not Requires: stopping the mount must not stop Docker and unrelated containers.
Wants=systemd-tmpfiles-setup.service run-nex\x2ddemo.mount
After=systemd-tmpfiles-setup.service run-nex\x2ddemo.mount
