# Nex Controller guest image (the controller profile of the Nex image tooling). Built by `image/build.sh controller`
# (the Mirror and the package pin come from there: image/snapshot, image/controller/controller.packages).
# Same Debian trixie snapshot, same mkosi and release tooling as the host image; no package manager ships in the guest.
[Config]
Dependencies=

[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64

[Output]
Format=directory
Output=controller
ImageId=nex-controller
Seed=5e1ec7ed-0000-4000-8000-000000000003
ManifestFormat=json
SplitArtifacts=kernel,initrd

[Build]
Environment=NEX_LABEL NEX_SEQUENCE

[Content]
SourceDateEpoch=1790000000
Bootable=yes
Bootloader=none
UnifiedKernelImages=no
WithDocs=no
Locale=C.UTF-8
CleanPackageMetadata=no
# A virtio guest: the initrd finds the verity root on the system disk and makes or mounts /var on the data disk. The SATA
# controller and the sd and sr drivers are there too: the NoCloud seed is a SATA CD-ROM, and cloud-init's generator looks for it
# before udev has probed anything the initrd did not.
KernelModulesInitrdInclude=
        /erofs.ko
        /dm-verity.ko
        /overlay.ko
        /ext4.ko
        /vfat.ko
        /virtio_blk.ko
        /virtio_pci.ko
        /ahci.ko
        /sd_mod.ko
        /sr_mod.ko
        /fs/nls/
        /sha256_ssse3.ko
        /crc32c-intel.ko
KernelModulesInitrdExclude=.*
InitrdPackages=e2fsprogs
