# The Controller's service account, with the same ids in every image of this guest. firstboot gives /etc/nex-controller and
# /var/lib/nex-controller to this account on the data disk; a Core swap replaces the root image under that data, so a uid that
# drifted with the package set would leave the Controller unable to read its own TLS key (system ids below 1000 are otherwise
# handed out by whatever package asks first). systemd-sysusers treats an id as a suggestion and takes another one when it is
# taken, so mkosi.postinst.chroot checks that the account really has 280:280 and fails the build otherwise.
g nex-controller 280
u nex-controller 280:nex-controller "Nex Controller" /var/lib/nex-controller /usr/sbin/nologin
