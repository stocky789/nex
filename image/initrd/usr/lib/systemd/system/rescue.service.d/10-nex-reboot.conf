# A failed verity or storage step never ends at the locked initrd shell. A counted boot reboots at once
# (nex-initrd-reboot.service) so the boot counter advances and the previous image is tried; a blessed boot reboots
# after a pause (nex-initrd-reboot-paced.service). Exactly one of the two units runs.
[Unit]
Wants=nex-initrd-reboot.service nex-initrd-reboot-paced.service
After=nex-initrd-reboot.service nex-initrd-reboot-paced.service
