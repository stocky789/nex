# nex-cluster: an overlay on the finished base tree. Only what the packages add reaches the output; the rest
# (normalising /etc and /var, sysusers, unit ordering, extension-release, module indexes) is
# scripts/layer-finalize.py, run by image/mkosi.images/build-layer.sh before the erofs is packed.
[Distribution]
Distribution=debian
Release=trixie
Repositories=main contrib
Architecture=x86-64

[Output]
Format=directory
Output=nex-cluster
ImageId=nex-cluster
SourceDateEpoch=1790000000
Seed=5e1ec7ed-0000-4000-8000-000000000003

[Content]
Bootable=no
Bootloader=none
WithDocs=no
Locale=C.UTF-8
CleanPackageMetadata=no
Overlay=yes
