# State directories the Debian cluster packages create in their maintainer scripts. A layer carries no /var
# (layer-finalize refuses it) and Core runs systemd-tmpfiles after the merge, so they are declared here. Without
# /var/lib/corosync corosync exits at start with "Cannot chdir to state directory" (found by the pool lab).
d /var/lib/corosync 0755 root root -
d /var/lib/pacemaker 0750 hacluster haclient -
d /var/lib/pacemaker/cib 0750 hacluster haclient -
d /var/lib/pacemaker/pengine 0750 hacluster haclient -
d /var/lib/pacemaker/blackbox 0750 hacluster haclient -
d /var/lib/pacemaker/cores 0750 hacluster haclient -
d /var/log/pacemaker 0770 hacluster haclient -
d /var/log/pacemaker/bundles 0775 hacluster haclient -
d /var/lib/sanlock 0775 sanlock sanlock -
d /var/lib/pcsd 0700 root root -
d /var/log/pcsd 0700 root root -
