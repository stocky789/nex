# Accounts the Debian cluster packages create in their maintainer scripts (pacemaker-common: adduser hacluster, sanlock).
# The mkosi overlay of this layer carries none of them (found by the pool lab: `id hacluster` failed on a host that had
# merged the layer), so they are declared here with fixed ids, the same on every host and release, and Core runs
# systemd-sysusers after the merge.
g haclient 189
u hacluster 189:haclient "HA cluster" /var/lib/pacemaker /usr/sbin/nologin
g sanlock 179
u sanlock 179:sanlock "sanlock" /var/lib/sanlock /usr/sbin/nologin
