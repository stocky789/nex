# Throwaway Phase I-0 spike image. Not product code; see docs/qa/image/phase0.md.
[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64
# Pinned archive snapshot so two builds see the same package set (S9).
Mirror=https://snapshot.debian.org/archive/debian/20260929T000000Z/

[Output]
Format=disk
Output=nexspike
OutputDirectory=mkosi.output
CacheDirectory=mkosi.cache
ImageId=nex-core
ImageVersion=0.0.1
SourceDateEpoch=1790000000
Seed=5e1ec7ed-0000-4000-8000-000000000001
ManifestFormat=json

[Content]
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=yes
Autologin=yes
RootPassword=
WithDocs=no
CleanPackageMetadata=yes
KernelCommandLine=console=tty0 console=ttyS0,115200n8 panic=10 systemd.ssh_auto=no
KernelModulesInitrdInclude=erofs dm-verity overlay ext4 vfat virtio_blk virtio_pci virtio_scsi sd_mod ahci nvme
Packages=
        systemd
        systemd-boot
        systemd-boot-efi
        systemd-sysv
        systemd-container
        udev
        dbus
        kmod
        linux-image-amd64
        libvirt-daemon-system
        libvirt-daemon-driver-qemu
        openssh-server
        iproute2
        ifupdown
        nftables
        util-linux
        fdisk
        gdisk
        dosfstools
        mtools
        e2fsprogs
        erofs-utils
        cryptsetup-bin
        efibootmgr
        mdadm
        procps
        less
