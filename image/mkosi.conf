# Nex Core base image. Built by image/build.sh (the Mirror and package list come from there:
# image/snapshot, image/base.packages). Optional layers are separate projects under mkosi.images/.
[Config]
Dependencies=

[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64
# Debian's own firmware and microcode live in non-free-firmware; Debian installs them by default on hardware that needs them.
Repositories=main non-free-firmware

[Output]
Format=directory
Output=base
ImageId=nex-core
Seed=5e1ec7ed-0000-4000-8000-000000000002
ManifestFormat=json
SplitArtifacts=kernel,initrd

[Build]
Environment=NEX_LABEL NEX_SEQUENCE NEX_STATE_FORMAT NEX_MIN_STATE_FORMAT NEX_MD_GENERATION NEX_MD_FALLBACK_SAFE

[Content]
# Overridden by SOURCE_DATE_EPOCH for release builds.
SourceDateEpoch=1790000000
# The release step (image/release.py) builds the erofs, verity tree, UKI and boot files;
# mkosi only supplies the tree, kernel and initrd.
Bootable=yes
Bootloader=none
UnifiedKernelImages=no
WithDocs=no
Locale=C.UTF-8
# image/mkosi.finalize saves the dpkg database for the layer builds before removing it.
CleanPackageMetadata=no
# Trimmed initrd: the filesystems and md/verity pieces that mount root, /var (single disk or md RAID1) and /etc, plus every
# storage driver directory of the Debian kernel, so any disk Debian itself boots from (virtio, Xen, Hyper-V, VMware, legacy
# ATA/IDE, SATA, SAS/RAID HBAs, FC, NVMe, USB, eMMC/SD) reaches root. Network, graphics, sound and wireless drivers stay out;
# they load from the verity root after switch-root. Drivers are small; a missing one leaves the host unable to find its disk.
# mkosi applies the include list only when an exclude pattern exists; ".*" drops every other module, and
# dependencies of the listed ones are kept. Patterns are regular expressions on kernel/<path>.ko.xz.
KernelModulesInitrdInclude=
        /erofs.ko
        /dm-verity.ko
        /overlay.ko
        /ext4.ko
        /vfat.ko
        /fs/nls/
        /drivers/md/
        /drivers/block/
        /drivers/ata/
        /drivers/scsi/
        /drivers/message/
        /drivers/nvme/
        /drivers/mmc/
        /drivers/hv/
        /drivers/xen/
        /drivers/virtio/
        /drivers/usb/host/
        /drivers/usb/storage/
        /sha256_ssse3.ko
        /crc32c-intel.ko
KernelModulesInitrdExclude=.*
InitrdPackages=mdadm
