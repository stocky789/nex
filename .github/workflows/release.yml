name: Release
# Push-driven release. Every push to main rebuilds the ISO and both Debian packages
# at the newest CHANGELOG version, then creates the Gitea release for tag vX.Y.Z[-preN],
# replacing that version's previous release and moving its tag when the version was
# already published. Forge release assets are the ISO, matching source bundle and
# compliance manifest only — not standalone .deb downloads. Packages remain build
# products for the ISO and, when deploy secrets are set, the signed APT update feed.
# The CHANGELOG heading and the Debian package version are one number in two
# notations, so a release can never ship stamped with a version its changelog does
# not describe.
#
# The ISO build runs builder containers on the runner's Docker host. On a runner that
# executes jobs inside a container, the workspace is a Docker volume; the job finds
# that volume's host path and scripts/ci-docker.sh rewrites every bind mount to it.
#
# Secrets:
#   NEX_APPLIANCE_SIGNING_KEY   Ed25519 PEM private key that signs the Controller
#                               appliance manifest. Without it the build signs with a
#                               throwaway key generated for that run, and warns.
#   NEX_DEPLOY_HOST             website publishing: host address, publishing user, that
#   NEX_DEPLOY_USER             user's SSH key, and the host's public key. Set all four
#   NEX_DEPLOY_KEY              or none. With none, the Gitea release is the only output.
#   NEX_DEPLOY_KNOWN_HOSTS      With all four, the same run publishes signed APT packages,
#                               ISO/source downloads, and the static website pages.
on:
  push:
    branches:
      - main
concurrency:
  # Same group as Controller foundation: one act_runner cannot ISO-build and
  # run Playwright labs at once (runs 4222+4223).
  group: ${{ github.server_url == 'https://github.com' && github.workflow || 'nex-shared-runner' }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  release:
    if: github.server_url != 'https://github.com'  # github.com runs github.yml only
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      # The corresponding-source archive vendors the Go modules and records the
      # toolchain, so the job needs the pinned Go the appliance builds with.
      - uses: https://github.com/actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'

      - name: Resolve release version and notes from CHANGELOG
        id: version
        run: |
          set -euo pipefail
          read -r tag_version version < <(python3 scripts/release-version.py --current --format both)
          mkdir -p .cache
          python3 scripts/release-version.py --current --notes > .cache/release-notes.md
          echo "tag=v$tag_version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing v$tag_version as Debian version $version"

      - name: Locate the workspace on the Docker host
        id: host
        run: |
          set -euo pipefail
          docker info > /dev/null
          probe() {
            docker run --rm -v "$1:/probe:ro" --entrypoint sh debian:trixie-slim \
              -c 'test -f /probe/installer/build.sh' 2> /dev/null
          }
          host=$PWD
          if ! probe "$host"; then
            # Jobs run inside a container: the workspace is a named volume. Read which
            # one from our own mount table and ask the daemon where it lives on the host.
            root=$(awk -v w="$PWD" '$5 == w { print $4 }' /proc/self/mountinfo)
            name=$(printf '%s\n' "$root" | sed -n 's#.*/volumes/\([^/]*\)/_data.*#\1#p')
            [ -n "$name" ] || {
              echo "workspace $PWD is neither a Docker host path nor a Docker volume (mount root: '$root')" >&2
              exit 1
            }
            host=$(docker volume inspect -f '{{.Mountpoint}}' "$name")
            probe "$host" || {
              echo "Docker host path $host for volume $name does not contain this workspace" >&2
              exit 1
            }
          fi
          echo "workspace=$host" >> "$GITHUB_OUTPUT"
          echo "The Docker host sees the workspace at $host"

      - name: Restore the pinned Debian cloud base image
        id: base-image
        uses: https://github.com/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/appliance
          key: appliance-base-debian-13-genericcloud-amd64-20260831-2587
      - name: Fetch the pinned Debian cloud base image
        if: steps.base-image.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # installer/build.sh verifies this file against its pinned SHA-256 before use.
          mkdir -p .cache/appliance
          image=debian-13-genericcloud-amd64-20260831-2587.qcow2
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 --continue-at - \
            "https://cloud.debian.org/images/cloud/trixie/20260831-2587/$image" \
            -o ".cache/appliance/$image.partial"
          mv ".cache/appliance/$image.partial" ".cache/appliance/$image"

      - name: Prepare the appliance signing key
        id: signing
        env:
          NEX_APPLIANCE_SIGNING_KEY_PEM: ${{ secrets.NEX_APPLIANCE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          umask 077
          # appliance/build.py requires the key outside the repository with mode 0600.
          key=$HOME/nex-appliance-signing.pem
          if [ -n "${NEX_APPLIANCE_SIGNING_KEY_PEM:-}" ]; then
            printf '%s\n' "$NEX_APPLIANCE_SIGNING_KEY_PEM" > "$key"
          else
            openssl genpkey -algorithm ed25519 -out "$key"
            echo "::warning::NEX_APPLIANCE_SIGNING_KEY is not set: the Controller appliance in this release is signed with a throwaway key generated for this run."
          fi
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Build source archive, packages and ISO
        env:
          NEX_VERSION: ${{ steps.version.outputs.version }}
          NEX_HOST_WORKSPACE: ${{ steps.host.outputs.workspace }}
          NEX_APPLIANCE_SIGNING_KEY: ${{ steps.signing.outputs.key }}
        run: |
          set -euo pipefail
          export NEX_DOCKER=$PWD/scripts/ci-docker.sh
          # Builder containers can only mount paths under the workspace, so the
          # temporary build inputs must live there too.
          export TMPDIR=$PWD/.cache/tmp
          mkdir -p "$TMPDIR"
          # build.sh rebuilds the appliance and the nex-core-local package from current
          # source, then the ISO from that package. The Controller package is separate.
          bash installer/build.sh
          python3 packaging/controller/build.py \
            --source dist/nex-source.tar.gz --version "$NEX_VERSION" \
            --output dist/controller --docker "$NEX_DOCKER"

      - name: Verify every artifact carries the released version
        env:
          NEX_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          iso="dist/nex-core-${NEX_VERSION}-amd64.iso"
          source="dist/nex-core-${NEX_VERSION}-source.tar.gz"
          manifest="dist/nex-core-${NEX_VERSION}-compliance-manifest.json"
          core="dist/core-local/nex-core-local_${NEX_VERSION}_amd64.deb"
          controller="dist/controller/nex-controller_${NEX_VERSION}_amd64.deb"
          for artifact in "$iso" "$source" "$manifest" "$core" "$controller"; do
            [ -f "$artifact" ] || { echo "missing artifact: $artifact" >&2; exit 1; }
            stat --printf='%n: %s bytes\n' "$artifact"
          done
          # A matching filename is not proof of a matching package version.
          for deb in "$core" "$controller"; do
            actual=$(dpkg-deb -f "$deb" Version)
            [ "$actual" = "$NEX_VERSION" ] || {
              echo "$deb declares $actual, expected $NEX_VERSION" >&2; exit 1; }
          done
          ( cd dist && for artifact in \
              "nex-core-${NEX_VERSION}-amd64.iso" \
              "nex-core-${NEX_VERSION}-source.tar.gz" \
              "nex-core-${NEX_VERSION}-compliance-manifest.json"; do
              sha256sum "$artifact" > "$artifact.sha256"
            done )

      - name: Smoke-start the packaged Controller
        env:
          NEX_VERSION: ${{ steps.version.outputs.version }}
          NEX_HOST_WORKSPACE: ${{ steps.host.outputs.workspace }}
        run: |
          set -euo pipefail
          scripts/ci-docker.sh run --rm --entrypoint python3 -v "$PWD:/repo:ro" \
            nex-controller-builder /repo/scripts/check-controller-package.py \
            "/repo/dist/controller/nex-controller_${NEX_VERSION}_amd64.deb"

      - name: Check for deploy credentials
        id: deploy
        env:
          NEX_DEPLOY_HOST: ${{ secrets.NEX_DEPLOY_HOST }}
          NEX_DEPLOY_KEY: ${{ secrets.NEX_DEPLOY_KEY }}
          NEX_DEPLOY_USER: ${{ secrets.NEX_DEPLOY_USER }}
          NEX_DEPLOY_KNOWN_HOSTS: ${{ secrets.NEX_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -eu
          # Every deploy secret or none. None is a fork or a clone with no website to
          # publish to, and skipping is right there. A partial set is always a
          # misconfiguration, and skipping it quietly is how the download page sat three
          # versions behind a green pipeline. Fail instead, and name the secret that is
          # missing, while nothing is published and the tag has not moved yet.
          missing=""
          for pair in "NEX_DEPLOY_HOST=${NEX_DEPLOY_HOST:-}" \
                      "NEX_DEPLOY_USER=${NEX_DEPLOY_USER:-}" \
                      "NEX_DEPLOY_KEY=${NEX_DEPLOY_KEY:-}" \
                      "NEX_DEPLOY_KNOWN_HOSTS=${NEX_DEPLOY_KNOWN_HOSTS:-}"; do
            if [ -z "${pair#*=}" ]; then
              missing="$missing ${pair%%=*}"
            fi
          done
          missing=${missing# }
          if [ -n "$missing" ] && [ "$missing" != "NEX_DEPLOY_HOST NEX_DEPLOY_USER NEX_DEPLOY_KEY NEX_DEPLOY_KNOWN_HOSTS" ]; then
            echo "Website publishing is half-configured; missing: $missing" >&2
            echo 'Set every deploy secret or none. Refusing to pass a release that silently skips the website.' >&2
            exit 1
          fi
          if [ -n "$missing" ]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'No deploy secrets are set: publishing the Gitea release only, not APT, downloads, or the website.'
            exit 0
          fi
          echo 'enabled=true' >> "$GITHUB_OUTPUT"
      - name: Set up Node.js for the website
        if: steps.deploy.outputs.enabled == 'true'
        uses: https://github.com/actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Build the static website
        if: steps.deploy.outputs.enabled == 'true'
        run: |
          npm --prefix website ci
          npm --prefix website run check
          npm --prefix website run build

      - name: Create or replace the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEX_VERSION: ${{ steps.version.outputs.version }}
          NEX_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          python3 scripts/gitea-release.py \
            --tag "$NEX_TAG" --target "$GITHUB_SHA" \
            --name "Nex Core $NEX_VERSION" --notes .cache/release-notes.md \
            "dist/nex-core-${NEX_VERSION}-amd64.iso" \
            "dist/nex-core-${NEX_VERSION}-amd64.iso.sha256" \
            "dist/nex-core-${NEX_VERSION}-source.tar.gz" \
            "dist/nex-core-${NEX_VERSION}-source.tar.gz.sha256" \
            "dist/nex-core-${NEX_VERSION}-compliance-manifest.json" \
            "dist/nex-core-${NEX_VERSION}-compliance-manifest.json.sha256"

      - name: Publish to the website host
        if: steps.deploy.outputs.enabled == 'true'
        env:
          NEX_VERSION: ${{ steps.version.outputs.version }}
          NEX_DEPLOY_HOST: ${{ secrets.NEX_DEPLOY_HOST }}
          NEX_DEPLOY_KEY: ${{ secrets.NEX_DEPLOY_KEY }}
          NEX_DEPLOY_KNOWN_HOSTS: ${{ secrets.NEX_DEPLOY_KNOWN_HOSTS }}
          NEX_DEPLOY_USER: ${{ secrets.NEX_DEPLOY_USER }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${NEX_DEPLOY_KNOWN_HOSTS:-}" ]; then
            echo 'NEX_DEPLOY_KNOWN_HOSTS is required; refusing to trust an unverified host' >&2
            exit 1
          fi
          # umask before writing the key: a world-readable key is refused by ssh anyway,
          # and the runner's workspace may be shared between jobs.
          umask 077
          keydir=$(mktemp -d)
          trap 'rm -rf "$keydir"' EXIT
          printf '%s\n' "$NEX_DEPLOY_KEY" > "$keydir/id"
          printf '%s\n' "$NEX_DEPLOY_KNOWN_HOSTS" > "$keydir/known_hosts"
          ssh_opts="-i $keydir/id -o IdentitiesOnly=yes -o UserKnownHostsFile=$keydir/known_hosts -o StrictHostKeyChecking=yes"
          target="$NEX_DEPLOY_USER@$NEX_DEPLOY_HOST"
          staging="/tmp/nex-release-$NEX_VERSION"

          # shellcheck disable=SC2086
          ssh $ssh_opts "$target" "rm -rf '$staging' && mkdir -m 700 '$staging'"
          # shellcheck disable=SC2086
          scp $ssh_opts \
            "dist/nex-core-${NEX_VERSION}-amd64.iso" \
            "dist/nex-core-${NEX_VERSION}-source.tar.gz" \
            "dist/nex-core-${NEX_VERSION}-compliance-manifest.json" \
            "dist/core-local/nex-core-local_${NEX_VERSION}_amd64.deb" \
            "dist/controller/nex-controller_${NEX_VERSION}_amd64.deb" \
            scripts/release-publish.py \
            "$target:$staging/"

          # Packages first: the signing key never leaves the host, and nex-apt-publish
          # is the one command the publishing user may run as root without a password.
          # shellcheck disable=SC2086
          ssh $ssh_opts "$target" "set -eu
            sudo -n /usr/local/sbin/nex-apt-publish '$staging/nex-core-local_${NEX_VERSION}_amd64.deb' '$staging/nex-controller_${NEX_VERSION}_amd64.deb'
            python3 '$staging/release-publish.py' --iso '$staging/nex-core-${NEX_VERSION}-amd64.iso' --source '$staging/nex-core-${NEX_VERSION}-source.tar.gz' --compliance-manifest '$staging/nex-core-${NEX_VERSION}-compliance-manifest.json' --keep 3
            rm -rf '$staging'"

          # Static pages last: same host, same secrets, one Release run.
          scripts/website-ci-deploy.sh

      - name: Confirm the release is actually reachable
        if: steps.deploy.outputs.enabled == 'true'
        env:
          NEX_VERSION: ${{ steps.version.outputs.version }}
          NEX_PUBLIC_URL: ${{ secrets.NEX_PUBLIC_URL || 'https://nexvirtualization.com' }}
        run: |
          set -euo pipefail
          # Check reachability without downloading multi-gigabyte payloads.
          # Read the small Packages index below to verify the released version.
          # The site answers 503 for a moment while the publish it just did settles (run 4319),
          # and curl treats 5xx as retryable only with --retry.
          for path in \
            "/" \
            "/apt/dists/nex/InRelease" \
            "/apt/dists/nex/main/binary-amd64/Packages" \
            "/downloads/${NEX_VERSION}/nex-core-${NEX_VERSION}-amd64.iso.sha256" \
            "/downloads/${NEX_VERSION}/nex-core-${NEX_VERSION}-source.tar.gz" \
            "/downloads/${NEX_VERSION}/nex-core-${NEX_VERSION}-compliance-manifest.json"; do
            code=$(curl -sSI -o /dev/null -w '%{http_code}' --max-time 60 --retry 10 --retry-delay 3 "${NEX_PUBLIC_URL}${path}")
            [ "$code" = 200 ] || { echo "$path returned $code" >&2; exit 1; }
          done
          curl -sS --max-time 60 --retry 10 --retry-delay 3 "${NEX_PUBLIC_URL}/apt/dists/nex/main/binary-amd64/Packages" \
            | grep -x "Version: ${NEX_VERSION}" > /dev/null || {
              echo "published index does not list ${NEX_VERSION}" >&2; exit 1; }
