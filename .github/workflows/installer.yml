name: Installer
# Deliberately diverges from .gitea/workflows/installer.yml, which is scoped down to
# source-level checks. GitHub-hosted runners are virtual machines with the privileges
# and real filesystem paths this job needs, so the full matrix is kept here: ISO build,
# initramfs completeness, native bridge and DHCP verification, and the wizard review.
# The Gitea runner executes jobs in an unprivileged container and cannot do any of it.
# See docs/BUG_LEDGER.md BUG-0043. Keep the two in sync again once that runner is
# switched to a host label.
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  installer:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Require Docker and build installer toolchain
        run: |
          docker info
          docker build -t nex-iso-builder -f installer/Dockerfile installer

      # Every step below bind-mounts the workspace into the builder image. When the
      # runner itself executes jobs inside a container, $PWD names a path that exists
      # only in the job container: Docker then creates it empty on the host and mounts
      # nothing, and the build fails later with a bare "No such file or directory".
      # Fail here instead, naming the cause and the fix.
      - name: Verify the workspace reaches the builder image
        run: |
          set -eu
          if ! docker run --rm -v "$PWD:/work" --entrypoint test nex-iso-builder -f /work/installer/check.sh; then
            echo 'The workspace did not reach the builder container.' >&2
            echo "\$PWD ($PWD) is not a path on the Docker host, so -v mounted an empty" >&2
            echo 'directory. This runner executes jobs inside a container.' >&2
            echo 'Fix: give act_runner a host label, for example "ubuntu-latest:host" in' >&2
            echo 'its config.yaml labels, so jobs run on the host and bind mounts resolve.' >&2
            exit 1
          fi
      - name: Run installer regressions
        run: |
          docker run --rm --platform linux/amd64 -v "$PWD:/work" --entrypoint bash nex-iso-builder -ec '
            bash installer/check.sh
            python3 tests/integration/installer-shell.py
            cc -Wall -Wextra -Werror tests/integration/installer-network.c installer/gui/nex-network.c $(pkg-config --cflags --libs glib-2.0) -o /tmp/nex-network-test
            /tmp/nex-network-test
            python3 tests/integration/installer-handoff.py
            python3 tests/integration/installer-keyboard.py
            python3 tests/integration/installer-qol.py
            python3 tests/integration/installer-hostname.py
            python3 tests/integration/installer-link.py
            python3 tests/integration/installer-disk.py
          '
      - name: Verify management bridge with native Debian networking
        run: bash tests/integration/installer-bridge.sh
      - name: Verify DHCP preview with native Debian networking
        run: bash tests/integration/installer-dhcp.sh
      - name: Build ISO and verify complete installer initramfs
        run: |
          docker run --rm --platform linux/amd64 -v "$PWD:/work" -e BUILD_UID="$(id -u)" -e BUILD_GID="$(id -g)" nex-iso-builder
          python3 tests/integration/installer-logo.py .cache/nex-iso/stage/install.amd/gtk/initrd.gz
      - name: Exercise native wizard review and disk confirmation
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 python3-pil
          python3 tests/integration/wizard-review.py dist/nex-core-*-amd64.iso --kernel .cache/nex-iso/stage/install.amd/vmlinuz --initrd .cache/nex-iso/stage/install.amd/gtk/initrd.gz --output /tmp/nex-wizard-review
          python3 tests/integration/wizard-review.py dist/nex-core-*-amd64.iso --kernel .cache/nex-iso/stage/install.amd/vmlinuz --initrd .cache/nex-iso/stage/install.amd/gtk/initrd.gz --output /tmp/nex-wizard-review-large --resolution 1024x768 --nics 2
          python3 tests/integration/installer-progress.py dist/nex-core-*-amd64.iso --kernel .cache/nex-iso/stage/install.amd/vmlinuz --initrd .cache/nex-iso/stage/install.amd/gtk/initrd.gz --output /tmp/nex-installer-progress
