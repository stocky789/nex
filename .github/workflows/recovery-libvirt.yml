name: Recovery libvirt regressions
on:
  push:
    branches:
      - '**'
  pull_request:
defaults:
  run:
    # Host-side flock preserves every queued run, including on forges without queue:max.
    shell: bash -c 'exec bash "$GITHUB_WORKSPACE/scripts/ci-heavy-step.sh" "$1"' -- {0}
permissions:
  contents: read
jobs:
  recovery-libvirt:
    if: github.server_url != 'https://github.com' # heavy disposable build is forge-only
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # Default host_run builds the candidate then runs helper, TCG lifecycle, and
      # the AppArmor system-guest midcommit probe. Branch and deep32 stay lab-only
      # (NEX_RECOVERY_SYSTEM_MODE=all) until they are stable on the forge runner.
      # Leftover (not wired here — long disposable Core labs, not safe/cheap for forge):
      # recovery_s0_interrupt.py, recovery_s0_backup.py, recovery_s0_firmware.py,
      # core_local_snapshot_api.py, core_snapshot_controller_replacement.py.
      - name: Build candidate and run helper, TCG lifecycle, and AppArmor midcommit guest
        run: |
          docker info >/dev/null
          python3 tests/integration/libvirt_recovery_ci.py
