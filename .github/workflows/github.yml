# SPDX-License-Identifier: AGPL-3.0-only
# The only job that runs on github.com, where hosted minutes are paid for.
#
# The forge executes this same directory (BUG-0043), so the split is made per job
# rather than per directory: every other job here carries
#   if: github.server_url != 'https://github.com'
# and is skipped — at no minute cost — on github.com, while the forge keeps running
# the full suite. This job is the mirror image of that condition.
#
# Deliberately not covered on github.com: browser/Playwright QA, go test -race,
# govulncheck, npm audit, the installer regressions, the website build and the ISO
# release. A pass here is not the phase gate; the forge run is.
name: GitHub checks
on:
  push:
    branches:
      - main
  pull_request:
concurrency:
  group: github-checks-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checks:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
      - name: Install packaging and hosting tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends nginx-core dpkg-dev gnupg
      # No -race here: the instrumented suite is the forge's job.
      - name: Test Go services
        run: go test ./...
      - name: Check contracts and contributor tools
        run: |
          python3 scripts/generate_api.py --check
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Check documentation impact and guide
        env:
          DOCS_EVENT: ${{ github.event_name }}
          DOCS_BEFORE: ${{ github.event.before }}
          DOCS_AFTER: ${{ github.event.after }}
          DOCS_PR_BASE: ${{ github.event.pull_request.base.sha }}
          DOCS_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          case "$DOCS_EVENT" in
            pull_request) python3 scripts/check_docs.py --base "$DOCS_PR_BASE" --head "$DOCS_PR_HEAD" --merge-base ;;
            push) python3 scripts/check_docs.py --base "$DOCS_BEFORE" --head "$DOCS_AFTER" ;;
            *) echo "Unsupported documentation event" >&2; exit 1 ;;
          esac
