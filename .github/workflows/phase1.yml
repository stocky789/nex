name: Controller foundation
on:
  push:
    branches:
      - '**'
  pull_request:
concurrency:
  group: phase1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  # Separate lanes so storage UI failures stay visible, capped at two concurrent
  # job containers inside this workflow on the shared Gitea act_runner.
  # Five fully parallel containers (plus Installer/Documentation on the same
  # Docker host) wedged cleanup in run 4168: truncated logs, synchronized
  # failure timestamps, and Installer marked failed after a clean test pass.
  #
  # Wave 1: go + controller-browser (UI fails fast; Go race runs alongside)
  # Wave 2: contracts + web
  # Wave 3: website
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
      # Keep production-strength password hashing and race checks; the shared
      # runner can exceed Go's default ten-minute package deadline.
      - name: Test Go services and recovery
        run: go test -race -timeout 20m ./...
      - name: Verify Controller package startup gate rejects the SQLite stub
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends dpkg-dev openssl gcc libc6-dev
          python3 tests/integration/controller_package_smoke.py
      - name: Check Go dependency advisories
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

  controller-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build UI assets for browser checks
        run: |
          npm --prefix web ci
          npm --prefix web run build
      - name: Prepare browser verification
        run: |
          python3 -m venv .cache/phase1-qa-venv
          .cache/phase1-qa-venv/bin/pip install playwright==1.62.0 pillow==12.3.0
          .cache/phase1-qa-venv/bin/python -m playwright install --with-deps chromium
      # Cheap storage-UI mocks first so this lane fails fast.
      - name: Verify ISO public URL and local upload browser workflows
        run: .cache/phase1-qa-venv/bin/python tests/integration/iso_url_browser.py --evidence .cache/iso-url-browser
      - name: Verify storage repository browser workflows with simulated host
        run: .cache/phase1-qa-venv/bin/python tests/integration/storage_repositories_browser.py --evidence .cache/storage-browser
      - name: Verify ZFS provisioning browser workflow with simulated Core replies
        run: .cache/phase1-qa-venv/bin/python tests/integration/zfs_provisioning_browser.py --evidence .cache/zfs-provisioning-browser
      - name: Verify clustered storage controls with simulated Core replies
        run: .cache/phase1-qa-venv/bin/python tests/integration/cluster_storage_browser.py
      - name: Capture Controller gallery with neutral demo inventory
        run: .cache/phase1-qa-venv/bin/python tests/integration/website_controller_captures.py --output .cache/website-controller-captures/images --evidence .cache/website-controller-captures/results.json
      - name: Verify enrollment, recovery and browser workflows
        run: .cache/phase1-qa-venv/bin/python tests/integration/phase1.py --browser
      - name: Verify console controls with simulated host
        run: .cache/phase1-qa-venv/bin/python tests/integration/console_controls_browser.py --evidence .cache/console-controls-browser
      - name: Verify managed VM browser workflows with simulated host
        run: .cache/phase1-qa-venv/bin/python tests/integration/managed_vm_browser.py --simulated --evidence .cache/managed-vm-browser
      - name: Verify VM editing browser workflow with simulated host
        run: .cache/phase1-qa-venv/bin/python tests/integration/vm_edit_browser.py --evidence .cache/vm-edit-browser
      - name: Verify host storage ISO visibility
        run: .cache/phase1-qa-venv/bin/python tests/integration/host_iso_browser.py --evidence .cache/host-iso-browser
      - name: Verify searchable site selection
        run: .cache/phase1-qa-venv/bin/python tests/integration/site_selector_browser.py --evidence .cache/site-selector-browser
      - name: Verify form select pickers render in the page and stay open
        run: .cache/phase1-qa-venv/bin/python tests/integration/form_select_picker.py --evidence .cache/form-select-picker

  contracts:
    needs: [go, controller-browser]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install dpkg tools and nginx for packaging and hosting checks
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends nginx-core dpkg-dev gnupg
      - name: Check contracts and contributor tools
        run: |
          python3 scripts/generate_api.py --check
          python3 -m unittest discover -s tests -p 'test_*.py' -v

  web:
    needs: [controller-browser]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build and check UI
        run: |
          npm --prefix web ci
          npm --prefix web run typecheck
          npm --prefix web run test
          npm --prefix web run build
      - name: Check UI dependency advisories
        run: npm --prefix web audit --audit-level=low

  website:
    needs: [web]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install nginx for hardened website checks
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends nginx-core
      - name: Build and check private website
        run: |
          npm --prefix website ci
          npm --prefix website run check
          npm --prefix website run build
      - name: Prepare browser verification
        run: |
          python3 -m venv .cache/phase1-qa-venv
          .cache/phase1-qa-venv/bin/pip install playwright==1.62.0 pillow==12.3.0
          .cache/phase1-qa-venv/bin/python -m playwright install --with-deps chromium
      - name: Verify website browser workflows
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 --directory website/build > /tmp/nex-website-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          .cache/phase1-qa-venv/bin/python tests/integration/website_browser.py --url http://127.0.0.1:8080 --evidence .cache/website-qa
      - name: Verify hardened website browser workflow
        run: |
          qa_root="$PWD/.cache/website-nginx"
          mkdir -p "$qa_root/log"
          sed -e 's|@NEX_WEBSITE_LISTEN@|127.0.0.1:8081|' -e "s|/srv/nex-website/current|$PWD/website/build|" -e "s|/run/nex-website/nginx.pid|$qa_root/nginx.pid|" -e "s|/run/nex-website|$qa_root|g" -e "s|/var/log/nex-website|$qa_root/log|g" packaging/website/nginx.conf.template > "$qa_root/nginx.conf"
          nginx -t -c "$qa_root/nginx.conf"
          nginx -c "$qa_root/nginx.conf" -g 'daemon off;' &
          nginx_pid=$!
          trap 'kill "$nginx_pid"' EXIT
          .cache/phase1-qa-venv/bin/python tests/integration/website_hardening_browser.py --url http://127.0.0.1:8081 --evidence .cache/website-hardening-qa

  # Keeps a single required check name for branch protection / dashboards.
  phase1:
    needs: [go, contracts, web, controller-browser, website]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Require every lane
        run: |
          set -eu
          echo "go=${{ needs.go.result }}"
          echo "contracts=${{ needs.contracts.result }}"
          echo "web=${{ needs.web.result }}"
          echo "controller-browser=${{ needs.controller-browser.result }}"
          echo "website=${{ needs.website.result }}"
          test "${{ needs.go.result }}" = success
          test "${{ needs.contracts.result }}" = success
          test "${{ needs.web.result }}" = success
          test "${{ needs.controller-browser.result }}" = success
          test "${{ needs.website.result }}" = success
