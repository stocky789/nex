name: Controller foundation
# Fast checks only: everything builds, vets and type-checks, the unit tests pass, and the generated API reference is current.
# Booting the images and ISOs is image.yml and release.yml.
on:
  # Integration pushes and feature pull requests each need their own verdict.
  push:
    branches:
      - main
      - dev
  pull_request:
defaults:
  run:
    # Host-side flock preserves every queued run, including on forges without queue:max.
    shell: bash -c 'exec bash "$GITHUB_WORKSPACE/scripts/ci-heavy-step.sh" "$1"' -- {0}
permissions:
  contents: read
env:
  NEX_CI_LOCK: shared
jobs:
  go:
    if: github.server_url != 'https://github.com'  # github.com runs github.yml only
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
      - name: Build and vet
        run: |
          go build ./...
          go vet ./...
      # The shared runner can exceed Go's default ten-minute package deadline.
      - name: Test Go services
        run: go test -timeout 40m ./...

  web:
    if: github.server_url != 'https://github.com'  # github.com runs github.yml only
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Typecheck, test and build the UI
        run: |
          npm --prefix web ci
          npm --prefix web run typecheck
          npm --prefix web run test
          npm --prefix web run build

  checks:
    if: github.server_url != 'https://github.com'  # github.com runs github.yml only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: API reference is current, Python compiles, shell scripts parse
        run: |
          set -euo pipefail
          python3 scripts/generate_api.py --check
          python3 -m compileall -q scripts tests installer appliance image packaging
          git ls-files '*.sh' | while read -r script; do bash -n "$script" || { echo "syntax error in $script" >&2; exit 1; }; done

  # Keeps a single required check name for branch protection / dashboards.
  phase1:
    needs: [go, web, checks]
    runs-on: ubuntu-latest
    # github.com runs github.yml only; always() keeps this gate reporting on the forge.
    if: always() && github.server_url != 'https://github.com'
    steps:
      - name: Require every lane
        shell: bash
        run: |
          set -eu
          echo "go=${{ needs.go.result }} web=${{ needs.web.result }} checks=${{ needs.checks.result }}"
          test "${{ needs.go.result }}" = success
          test "${{ needs.web.result }}" = success
          test "${{ needs.checks.result }}" = success
