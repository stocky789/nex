[Unit]
After=systemd-tmpfiles-setup.service
Requires=systemd-tmpfiles-setup.service

[Service]
EnvironmentFile=
ExecStart=
ExecStartPre=
ExecStartPre=+/usr/local/lib/nex/qnetd-runtime-init
ExecStart=/usr/bin/corosync-qnetd -f -s req -c on -p 5403 -S nss_db_dir=/run/nex-witness/nssdb
UMask=0007
